<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct File Hardcoded Secret Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
            <h1 class="text-xl font-bold text-indigo-400">Direct File Hardcoded Secret Scanner</h1>
            <p class="text-xs text-slate-400 mt-1">Select and upload your project files directly. The tool will scan them instantly for hardcoded passwords, PINs, keys, and credentials.</p>
        </header>

        <!-- File Upload Section -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg space-y-4">
            <label class="block text-xs uppercase tracking-wider text-slate-400">Upload Code Files (.html, .js, .php, .py, .txt, .json):</label>
            <input type="file" id="file-input" multiple accept=".html,.js,.php,.py,.txt,.json,.css" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            <button onclick="scanUploadedFiles()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-xs font-medium transition">Scan Uploaded Files</button>
        </div>

        <!-- Results Section -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
            <h2 class="text-sm font-semibold text-slate-200 mb-3">Scan Results & Detected Secrets</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 uppercase text-slate-400">
                        <tr>
                            <th class="p-3">File Name</th>
                            <th class="p-3">Variable / Secret Type</th>
                            <th class="p-3">Extracted Value</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody" class="divide-y divide-slate-700">
                        <tr><td colspan="3" class="p-4 text-center text-slate-500">No files uploaded or scanned yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function scanUploadedFiles() {
            const fileInput = document.getElementById('file-input');
            const tbody = document.getElementById('results-tbody');
            tbody.innerHTML = '';

            if (fileInput.files.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">Please select at least one file first.</td></tr>`;
                return;
            }

            let totalMatches = 0;
            const patterns = [
                /(?:password|passwd|pwd|pass|secret|api[_-]?key|token|auth)\s*[:=]\s*["']([^"'\s]+)["']/gi,
                /["'](pass[a-z0-9_-]*)["']\s*[:=]\s*["']([^"'\s]+)["']/gi
            ];

            for (let file of fileInput.files) {
                try {
                    const text = await readFileContent(file);
                    const seenValues = new Set();

                    patterns.forEach(regex => {
                        let match;
                        while ((match = regex.exec(text)) !== null) {
                            const label = match[1] || "Potential Secret";
                            const value = match[2] || match[1];

                            if (!seenValues.has(value)) {
                                seenValues.add(value);
                                totalMatches++;
                                tbody.innerHTML += `
                                    <tr class="hover:bg-slate-700/40">
                                        <td class="p-3 font-mono text-slate-300">${escapeHtml(file.name)}</td>
                                        <td class="p-3 font-mono text-amber-400">${escapeHtml(label)}</td>
                                        <td class="p-3 font-mono text-indigo-300 font-bold select-all">${escapeHtml(value)}</td>
                                    </tr>
                                `;
                            }
                        }
                    });
                } catch (err) {
                    console.error("Error reading file:", file.name, err);
                }
            }

            if (totalMatches === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">No hardcoded passwords or secrets found in the uploaded files.</td></tr>`;
            }
        }

        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file);
            });
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
