<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AssetGuard Pro - Inventory List & Grid</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f172a;
    --accent:#0072CE;
    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;
    --bg:#f4f7fa;
    --white:#fff;
    --text-main:#1e293b;
    --text-sub:#64748b;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    outline:none;
}

body {
    font-family:Poppins,sans-serif;
    background:var(--bg);
    margin:0;
    color:var(--text-main);
    line-height:1.5;
    overflow-x:hidden;
}

.sticky-header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#fff;
    z-index:1000;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e2e8f0;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header-left {
    font-weight:800;
    font-size:16px;
    color:var(--primary);
    letter-spacing:-.5px;
}

.header-left span {
    color:var(--accent);
}

.header-right {
    font-size:11px;
    font-weight:800;
    color:var(--text-sub);
    text-transform:uppercase;
    letter-spacing:1px;
}

.app-container {
    max-width:700px;
    margin:0 auto;
    padding:90px 15px 40px;
}

/* ================================
   FREEZE BANNER
================================ */

.freeze-banner {
    background:#fef3c7;
    border:1px solid #f59e0b;
    color:#92400e;
    padding:13px 16px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    margin-bottom:15px;
    display:none;
    align-items:flex-start;
    gap:8px;
    box-shadow:0 2px 8px rgba(245,158,11,.1);
}

.freeze-banner.active {
    display:flex;
}

.freeze-title {
    font-weight:800;
}

.freeze-status {
    font-size:10px;
    margin-top:3px;
    font-weight:600;
}

/* ================================
   CONTROLS
================================ */

.controls-row {
    display:flex;
    gap:10px;
    margin-bottom:20px;
    align-items:center;
}

.search-box {
    flex:1;
    padding:14px 18px;
    border:1px solid #e2e8f0;
    border-radius:14px;
    font-size:14px;
    background:#fff;
    box-shadow:0 2px 4px rgba(0,0,0,.02);
    font-family:inherit;
}

.btn-add {
    background:var(--accent);
    color:#fff;
    border:0;
    width:48px;
    height:48px;
    border-radius:14px;
    font-size:24px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(0,114,206,.2);
}

.btn-add:disabled,
.btn-main:disabled {
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

/* ================================
   MOBILE
================================ */

@media(max-width:767px) {

    .app-container {
        max-width:500px;
        padding:85px 15px 30px;
    }

    .stock-container {
        display:flex;
        flex-direction:column;
        gap:10px;
    }

    .stock-item {
        background:#fff;
        padding:14px 16px;
        border-radius:16px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        border:1px solid rgba(226,232,240,.8);
        position:relative;
        overflow:hidden;
    }

    .stock-item::before {
        content:"";
        position:absolute;
        left:0;
        top:0;
        bottom:0;
        width:4px;
    }

    .status-good::before {
        background:var(--success);
    }

    .status-low::before {
        background:var(--warning);
    }

    .status-out::before {
        background:var(--danger);
    }

    .status-frozen::before {
        background:var(--warning)!important;
    }

    .item-info h3 {
        margin:0;
        font-size:13px;
        font-weight:700;
        text-transform:uppercase;
        color:var(--primary);
    }

    .item-info p {
        margin:2px 0 0;
        font-size:11px;
        color:var(--text-sub);
    }

    .qty-val {
        font-size:14px;
        font-weight:700;
        background:#f1f5f9;
        padding:6px 12px;
        border-radius:8px;
        color:var(--primary);
    }
}

/* ================================
   DESKTOP
================================ */

@media(min-width:768px) {

    body {
        font-size:1.2rem;
    }

    .app-container {
        max-width:1200px!important;
    }

    .stock-container {
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
        gap:18px;
    }

    .stock-item {
        background:#fff;
        padding:20px;
        border-radius:18px;
        border:1px solid rgba(226,232,240,.8);
        position:relative;
        overflow:hidden;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        box-shadow:0 4px 15px rgba(0,0,0,.02);
        transition:.2s;
    }

    .stock-item:hover {
        transform:translateY(-3px);
        box-shadow:0 8px 25px rgba(0,0,0,.05);
    }

    .stock-item::before {
        content:"";
        position:absolute;
        left:0;
        top:0;
        bottom:0;
        width:5px;
    }

    .status-good::before {
        background:var(--success);
    }

    .status-low::before {
        background:var(--warning);
    }

    .status-out::before {
        background:var(--danger);
    }

    .status-frozen::before {
        background:var(--warning)!important;
    }

    .item-info h3 {
        margin:0 0 10px;
        font-size:15px;
        font-weight:700;
        text-transform:uppercase;
        color:var(--primary);
    }

    .item-info p {
        margin:0 0 10px;
        font-size:12px;
        color:var(--text-sub);
    }

    .qty-val {
        font-size:14px;
        font-weight:800;
        background:#f1f5f9;
        padding:6px 12px;
        border-radius:8px;
        align-self:flex-start;
        color:var(--primary);
    }
}

.view {
    display:none;
}

.view.active {
    display:block;
}

/* ================================
   ADMIN
================================ */

.admin-form {
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    margin-bottom:25px;
    border:1px solid #e2e8f0;
}

.modern-input {
    width:100%;
    padding:14px;
    border:1px solid #e2e8f0;
    border-radius:12px;
    margin-bottom:14px;
    font-size:14px;
    background:#fafafa;
    font-family:inherit;
}

.modern-input:focus {
    border-color:var(--accent);
    background:#fff;
}

.btn-main {
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
}

.numpad {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    max-width:280px;
    margin:0 auto;
}

.num-btn {
    background:#fff;
    border:1px solid #e2e8f0;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.02);
}

.manage-item {
    background:#fff;
    padding:14px 18px;
    border-radius:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid #e2e8f0;
}

/* ================================
   MODAL
================================ */

.modal-overlay {
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
}

.modal-card {
    background:#fff;
    width:90%;
    max-width:340px;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
}

/* ================================
   TOAST
================================ */

#toastContainer {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:3000;
    width:max-content;
    max-width:90%;
}

.toast {
    background:var(--primary);
    color:#fff;
    padding:12px 24px;
    border-radius:12px;
    font-size:12px;
    font-weight:600;
    margin-top:8px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.toast.error {
    background:var(--danger);
}

.toast.success {
    background:var(--success);
}
</style>
</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const app = initializeApp({
    databaseURL:
        "https://assetguard-c8c8c-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);


/* =========================================================
   USER / DATABASE PATHS
========================================================= */

const currentUID =
    localStorage.getItem("ag_active_uid") ||
    "global_user";


/*
    INVENTORY:
    users/{UID}/inventory

    DISPATCHES:
    ROOT /dispatches

    This matches the Firebase database structure shown
    in your screenshot.
*/

const inventoryPath =
    `users/${currentUID}/inventory`;

const dispatchesPath =
    "dispatches";


/* =========================================================
   LOCAL CACHE
========================================================= */

let inventoryCache =
    JSON.parse(
        localStorage.getItem(
            `ag_inv_cache_${currentUID}`
        ) || "{}"
    );

let dispatchesCache =
    JSON.parse(
        localStorage.getItem(
            `ag_dispatches_cache_${currentUID}`
        ) || "{}"
    );

let approvalCaches = {};

let syncQueue =
    JSON.parse(
        localStorage.getItem(
            `ag_inv_queue_${currentUID}`
        ) || "[]"
    );


/* =========================================================
   OPTIONAL ADMIN APPROVAL LOCATIONS
========================================================= */

const approvalPaths = [

    "adminApproval",

    "adminApprovals",

    "dispatchApprovals",

    "admin/dispatchApprovals"

];


/* =========================================================
   SAVE LOCAL DATA
========================================================= */

function saveLocal() {

    localStorage.setItem(
        `ag_inv_cache_${currentUID}`,
        JSON.stringify(inventoryCache)
    );

    localStorage.setItem(
        `ag_dispatches_cache_${currentUID}`,
        JSON.stringify(dispatchesCache)
    );

    localStorage.setItem(
        `ag_inv_queue_${currentUID}`,
        JSON.stringify(syncQueue)
    );

    localStorage.setItem(
        `ag_approval_cache_${currentUID}`,
        JSON.stringify(approvalCaches)
    );
}


/* =========================================================
   NORMALIZE VALUES
========================================================= */

function normalize(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

}


/* =========================================================
   APPROVAL DETECTION
========================================================= */

function explicitApproved(value) {

    if (
        value === true ||
        value === 1
    ) {
        return true;
    }

    if (typeof value === "string") {

        return [

            "approved",
            "approve",
            "admin_approved",
            "adminapproved",
            "authorized",
            "authorised",
            "accepted",
            "complete",
            "completed",
            "true",
            "yes"

        ].includes(
            normalize(value)
        );

    }

    return false;
}


/* =========================================================
   REJECTED / CANCELLED
========================================================= */

function explicitRejectedOrCancelled(value) {

    if (
        typeof value !== "string"
    ) {
        return false;
    }

    return [

        "rejected",
        "cancelled",
        "canceled",
        "declined",
        "void",
        "voided"

    ].includes(
        normalize(value)
    );
}


/* =========================================================
   CHECK ADMIN APPROVAL
========================================================= */

function isExplicitlyApproved(
    dispatchId,
    dispatch
) {

    if (
        !dispatch ||
        typeof dispatch !== "object"
    ) {
        return false;
    }


    const directFields = [

        "adminApproved",
        "approvedByAdmin",
        "adminApproval",
        "approval",
        "approvalStatus",
        "adminStatus",
        "approved"

    ];


    for (
        const field of directFields
    ) {

        const value =
            dispatch[field];


        if (
            explicitApproved(value)
        ) {
            return true;
        }


        if (
            value &&
            typeof value === "object"
        ) {

            if (

                explicitApproved(
                    value.status
                ) ||

                explicitApproved(
                    value.approved
                ) ||

                explicitApproved(
                    value.value
                ) ||

                explicitApproved(
                    value.state
                )

            ) {

                return true;

            }

        }

    }


    /*
       Check optional approval nodes.
    */

    for (
        const cache
        of Object.values(approvalCaches)
    ) {

        if (
            !cache ||
            typeof cache !== "object"
        ) {
            continue;
        }


        const record =
            cache[dispatchId];


        if (
            explicitApproved(record)
        ) {
            return true;
        }


        if (
            record &&
            typeof record === "object"
        ) {

            if (

                explicitApproved(
                    record.status
                ) ||

                explicitApproved(
                    record.approvalStatus
                ) ||

                explicitApproved(
                    record.approved
                ) ||

                explicitApproved(
                    record.adminApproved
                ) ||

                explicitApproved(
                    record.value
                )

            ) {

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   DISPATCH REQUIRES APPROVAL
========================================================= */

function dispatchRequiresApproval(
    dispatch
) {

    if (
        !dispatch ||
        typeof dispatch !== "object"
    ) {
        return false;
    }


    const status =
        normalize(

            dispatch.status ||

            dispatch.dispatchStatus ||

            dispatch.state ||

            dispatch.approvalStatus ||

            ""

        );


    /*
       Explicitly approved = unlock.
    */

    if (
        explicitApproved(status)
    ) {
        return false;
    }


    /*
       Explicitly rejected/cancelled = unlock.
    */

    if (
        explicitRejectedOrCancelled(status)
    ) {
        return false;
    }


    /*
       Normal pending statuses.
    */

    const knownPending = [

        "pending",
        "locked",
        "submitted",
        "requested",
        "awaiting_approval",
        "pending_approval",
        "awaiting_admin",
        "awaiting_admin_approval",
        "processing"

    ];


    if (
        knownPending.includes(status)
    ) {
        return true;
    }


    /*
       SAFETY RULE:
       A dispatch with no status remains frozen
       until explicit admin approval.
    */

    if (!status) {
        return true;
    }


    /*
       Unknown dispatch status is also frozen
       unless explicitly approved.
    */

    return true;

}


/* =========================================================
   FIND ALL FROZEN ITEMS
========================================================= */

function getFrozenItemKeys() {

    const frozenKeys =
        new Set();


    let pendingUnapproved =
        false;


    Object.entries(
        dispatchesCache || {}
    ).forEach(
        ([dispatchId, dispatch]) => {

            if (
                !dispatch ||
                typeof dispatch !== "object"
            ) {
                return;
            }


            /*
               Admin approved?
            */

            if (
                isExplicitlyApproved(
                    dispatchId,
                    dispatch
                )
            ) {

                return;

            }


            /*
               Still waiting?
            */

            if (
                dispatchRequiresApproval(
                    dispatch
                )
            ) {

                pendingUnapproved =
                    true;

            }

        }
    );


    /*
       IMPORTANT:
       Any pending/unapproved dispatch freezes
       the ENTIRE inventory.
    */

    if (
        pendingUnapproved
    ) {

        Object.keys(
            inventoryCache || {}
        ).forEach(
            key => frozenKeys.add(key)
        );

    }


    return frozenKeys;

}


/* =========================================================
   INVENTORY FROZEN?
========================================================= */

function isInventoryFrozen() {

    return (
        getFrozenItemKeys().size > 0
    );

}


/* =========================================================
   PENDING DISPATCHES
========================================================= */

function getPendingDispatches() {

    return Object.entries(
        dispatchesCache || {}
    ).filter(
        ([id, dispatch]) => {

            if (
                !dispatch ||
                typeof dispatch !== "object"
            ) {
                return false;
            }


            if (
                isExplicitlyApproved(
                    id,
                    dispatch
                )
            ) {
                return false;
            }


            return dispatchRequiresApproval(
                dispatch
            );

        }
    );

}


/* =========================================================
   FREEZE MESSAGE
========================================================= */

function getFreezeMessage() {

    const pending =
        getPendingDispatches();


    if (
        !pending.length
    ) {

        return "Inventory is available.";

    }


    const ids =
        pending
        .map(
            ([id]) => id
        )
        .join(", ");


    return (
        "Waiting for admin approval: " +
        ids
    );

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(value) {

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   SYNC QUEUE
========================================================= */

async function attemptSync() {

    if (
        !navigator.onLine ||
        !syncQueue.length
    ) {
        return;
    }


    /*
       NEVER sync inventory modifications
       while frozen.
    */

    if (
        isInventoryFrozen()
    ) {
        return;
    }


    for (
        let i = 0;
        i < syncQueue.length;
        i++
    ) {

        const item =
            syncQueue[i];


        try {

            if (
                item.isDelete
            ) {

                await remove(
                    ref(
                        db,
                        `${inventoryPath}/${item.id}`
                    )
                );

            } else {

                await update(

                    ref(
                        db,
                        `${inventoryPath}/${item.id}`
                    ),

                    {

                        id:item.id,

                        name:item.name,

                        qty:Number(
                            item.qty
                        ) || 0,

                        liters:Number(
                            item.liters
                        ) || 0,

                        salePrice:Number(
                            item.salePrice
                        ) || 0,

                        updatedAt:
                            item.updatedAt ||
                            Date.now()

                    }

                );

            }


            syncQueue.splice(
                i,
                1
            );

            i--;


            localStorage.setItem(

                `ag_inv_queue_${currentUID}`,

                JSON.stringify(
                    syncQueue
                )

            );


        } catch(error) {

            console.error(
                "Inventory sync error:",
                error
            );

            break;

        }

    }

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

window.handleSave =
async function() {

    /*
       HARD FREEZE CHECK.
    */

    if (
        isInventoryFrozen()
    ) {

        return notify(

            "ACTION BLOCKED: Inventory is frozen until admin approval.",

            "error"

        );

    }


    const name =
        document
        .getElementById(
            "itemName"
        )
        .value
        .trim();


    const qty =
        parseInt(
            document
            .getElementById(
                "itemQty"
            )
            .value
        ) || 0;


    const liters =
        parseFloat(
            document
            .getElementById(
                "itemLiters"
            )
            .value
        ) || 0;


    const price =
        parseFloat(
            document
            .getElementById(
                "salePrice"
            )
            .value
        ) || 0;


    if (!name) {

        return notify(
            "Product name required",
            "error"
        );

    }


    const key =
        name
        .replace(
            /\s+/g,
            "_"
        )
        .toLowerCase();


    const item = {

        id:key,

        name:name,

        qty:qty,

        liters:liters,

        salePrice:price,

        updatedAt:Date.now()

    };


    inventoryCache[key] =
        item;


    syncQueue.push(
        item
    );


    saveLocal();


    resetForm();

    renderDashboard();

    renderAdminList();


    notify(
        "Product saved successfully",
        "success"
    );


    await attemptSync();

};


/* =========================================================
   DELETE PRODUCT
========================================================= */

window.popDelete =
function(key) {

    if (
        isInventoryFrozen()
    ) {

        return notify(

            "ACTION BLOCKED: Inventory is frozen until admin approval.",

            "error"

        );

    }


    document
    .getElementById(
        "modalOverlay"
    )
    .style.display = "flex";


    document
    .getElementById(
        "modalConfirmBtn"
    )
    .onclick =
    async function() {


        /*
           Re-check before delete.
        */

        if (
            isInventoryFrozen()
        ) {

            closeModal();

            return notify(

                "ACTION BLOCKED: Admin approval is still pending.",

                "error"

            );

        }


        delete inventoryCache[key];


        syncQueue.push({

            id:key,

            isDelete:true

        });


        saveLocal();


        closeModal();


        renderDashboard();

        renderAdminList();


        notify(
            "Item deleted",
            "success"
        );


        await attemptSync();

    };

};


/* =========================================================
   RENDER DASHBOARD
========================================================= */

window.renderDashboard =
function() {

    const container =
        document
        .getElementById(
            "inventoryContainer"
        );


    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const freezeBanner =
        document
        .getElementById(
            "freezeBanner"
        );


    const freezeStatus =
        document
        .getElementById(
            "freezeStatus"
        );


    const addButton =
        document
        .getElementById(
            "addButton"
        );


    container.innerHTML = "";


    const frozen =
        isInventoryFrozen();


    if (frozen) {

        freezeBanner
        .classList
        .add("active");


        freezeStatus.textContent =
            getFreezeMessage();


        addButton.disabled =
            true;

    } else {

        freezeBanner
        .classList
        .remove("active");


        addButton.disabled =
            false;

    }


    const keys =
        Object.keys(
            inventoryCache || {}
        )
        .sort();


    if (!keys.length) {

        container.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:40px;
                    color:var(--text-sub)
                ">

                No inventory items found.
                Tap '+' to add products.

            </div>

        `;

        return;

    }


    keys.forEach(
        key => {

            const item =
                inventoryCache[key] || {};


            if (
                !String(
                    item.name || ""
                )
                .toLowerCase()
                .includes(search)
            ) {

                return;

            }


            const isFrozen =
                frozen;


            let status =

                Number(
                    item.qty || 0
                ) > 5

                ? "status-good"

                : Number(
                    item.qty || 0
                ) > 0

                ? "status-low"

                : "status-out";


            if (
                isFrozen
            ) {

                status =
                    "status-frozen";

            }


            container.innerHTML += `

                <div
                    class="stock-item ${status}"
                    style="${
                        isFrozen
                        ? "opacity:.86"
                        : ""
                    }">

                    <div class="item-info">

                        <h3>

                            ${escapeHtml(
                                item.name
                            )}

                            ${
                                isFrozen
                                ? `

                                    <span
                                        style="
                                            display:block;
                                            color:var(--warning);
                                            font-size:9px;
                                            margin-top:3px;
                                            font-weight:800
                                        ">

                                        🔒 FROZEN —
                                        ADMIN APPROVAL REQUIRED

                                    </span>

                                  `
                                : ""
                            }

                        </h3>

                        <p>

                            ${Number(
                                item.liters || 0
                            )}L

                            •

                            KES ${Number(
                                item.salePrice || 0
                            ).toLocaleString()}

                        </p>

                    </div>


                    <div class="qty-val">

                        ${Number(
                            item.qty || 0
                        )}

                    </div>

                </div>

            `;

        }
    );

};

/* =========================================================
   ADMIN APPROVAL LISTENERS
========================================================= */

approvalPaths.forEach(
    path => {

        onValue(
            ref(
                db,
                path
            ),

            snap => {

                approvalCaches[path] =
                    snap.exists()
                    ? (
                        snap.val() || {}
                      )
                    : {};


                saveLocal();

                renderDashboard();

                renderAdminList();


                /*
                   Once admin approval is detected,
                   queued inventory operations can sync.
                */

                if (
                    !isInventoryFrozen()
                ) {

                    attemptSync();

                }

            }
        );

    }
);


/* =========================================================
   PIN
========================================================= */

let pinBuffer = "";


window.pressNum =
function(n) {

    if (
        n === "C"
    ) {

        pinBuffer = "";

    } else if (
        n === "⌫"
    ) {

        pinBuffer =
            pinBuffer.slice(
                0,
                -1
            );

    } else if (
        pinBuffer.length < 4
    ) {

        pinBuffer += n;

    }


    document
    .querySelectorAll(
        ".pin-dot"
    )
    .forEach(
        (dot,index) => {

            dot.style.background =
                index < pinBuffer.length
                ? "var(--accent)"
                : "transparent";

        }
    );


    if (
        pinBuffer.length === 4
    ) {


        if (
            pinBuffer === "1234"
        ) {


            /*
               PIN CANNOT BYPASS FREEZE.
            */

            if (
                isInventoryFrozen()
            ) {

                notify(

                    "Access blocked: inventory is frozen until admin approval.",

                    "error"

                );


                pinBuffer = "";


                document
                .querySelectorAll(
                    ".pin-dot"
                )
                .forEach(
                    dot =>
                        dot.style.background =
                            "transparent"
                );


                return;

            }


            switchView(
                "view-admin"
            );


        } else {


            notify(
                "Invalid PIN",
                "error"
            );


            pinBuffer = "";


            document
            .querySelectorAll(
                ".pin-dot"
            )
            .forEach(
                dot =>
                    dot.style.background =
                        "transparent"
            );

        }

    }

};


/* =========================================================
   SWITCH VIEW
========================================================= */

window.switchView =
function(id) {

    document
    .querySelectorAll(
        ".view"
    )
    .forEach(
        v =>
            v.classList.remove(
                "active"
            )
    );


    document
    .getElementById(id)
    .classList.add(
        "active"
    );

};


/* =========================================================
   OPEN ADMIN
========================================================= */

window.openAdmin =
function() {

    if (
        isInventoryFrozen()
    ) {

        return notify(

            "Inventory is frozen until admin approval.",

            "error"

        );

    }


    pinBuffer = "";


    document
    .querySelectorAll(
        ".pin-dot"
    )
    .forEach(
        dot =>
            dot.style.background =
                "transparent"
    );


    switchView(
        "view-pin"
    );

};


/* =========================================================
   EDIT
========================================================= */

function(key) {

    if (

    ) {

        return notify(

            "Action blocked: inventory is frozen until admin approval.",

            "error"

    }


    const item =
        inventoryCache[key];

    }


    document

    )
    .value =

    document
    .getElementById(

    )
    .value =

    document
    .getElementById(
        "itemLiters"
    )
    .value =
        item.liters ?? "";


    document
    .getElementById(
        "salePrice"
    )
    .value =
        item.salePrice ?? "";

        "view-admin"
    );

};


/* =========================================================
   MODAL
========================================================= */

window.closeModal =
function() {

    document
    .getElementById(
        "modalOverlay"
    )
    .style.display =
        "none";

};


/* =========================================================
   NOTIFICATION
========================================================= */

window.notify =
function(
    message,
    type = ""
) {

    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    toast.innerText =
        message;


    document
    .getElementById(
        "toastContainer"
    )
    .appendChild(
        toast
    );


    setTimeout(
        () => toast.remove(),
        3200
    );

};


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

    [
        "itemName",
        "itemQty",
        "itemLiters",
        "salePrice"

    ].forEach(
        id => {

            document
            .getElementById(
                id
            )
            .value = "";

        }
    );

}


/* =========================================================
   ONLINE SYNC
========================================================= */

window.addEventListener(
    "online",
    () => {

        if (
            !isInventoryFrozen()
        ) {

            attemptSync();

        }

    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            !document.hidden
        ) {

            renderDashboard();

            renderAdminList();


            if (
                !isInventoryFrozen()
            ) {

                attemptSync();

            }

        }

    }
);


/* =========================================================
   INITIAL RENDER
========================================================= */

renderDashboard();

renderAdminList();

</script>
