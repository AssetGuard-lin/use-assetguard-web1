<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AssetGuard Pro - Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
body { margin: 0; height: 100vh; background: radial-gradient(circle at center, #2c5364, #0f2027); display: flex; flex-direction: column; align-items: center; overflow: hidden; padding-top: 50px; }
#notification { position: fixed; top: 20px; background: #333; color: #fff; padding: 12px 25px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; z-index: 5000; animation: slideDown 0.4s ease-out; }
@keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
.hero-content h1 { margin: 0; font-size: 2.5rem; color: white; text-align: center; }
.top-nav { width: 90%; max-width: 280px; background: linear-gradient(145deg, #1e3a46, #2c5364); border-radius: 50px; padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
.logo { color: #fff; font-weight: 800; font-size: 0.75rem; }
.menu-btn { background: #fff; color: #2c5364; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 700; }
.auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(8px); }
.scene { width: 340px; height: 640px; perspective: 1200px; }
.card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
.card.flip-register { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; background: #fff; border-radius: 20px; padding: 20px 25px; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; }
.register { transform: rotateY(180deg); }
h2 { margin-bottom: 8px; color: #2c5364; font-weight: 800; font-size: 1.3rem; }
input, select { width: 100%; padding: 10px 12px; margin: 4px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; background: #f9fbff; font-size: 14px; }
button.action-btn { width: 100%; padding: 12px; margin-top: 8px; background: #2c5364; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
.link { text-align: center; margin-top: 8px; font-size: 0.8rem; color: #2c5364; cursor: pointer; font-weight: 600; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 4000; }
.modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 300px; text-align: center; }

.role-picker { display: flex; gap: 6px; margin: 4px 0 8px 0; }
.role-option { flex: 1; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 4px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: #334155; cursor: pointer; transition: all 0.2s; text-align: center; }
.role-option input { margin-right: 4px; accent-color: #2c5364; width: auto; margin: 0 4px 0 0; }
.role-option:has(input:checked) { background: #2c5364; color: #fff; border-color: #2c5364; }
.role-label-title { font-size: 0.75rem; font-weight: 700; color: #475569; margin-top: 2px; text-align: left; }

.marketing-extra-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 8px; border-radius: 10px; margin: 4px 0; display: none; }
.auto-date-badge { font-size: 0.75rem; color: #0284c7; font-weight: 700; margin-bottom: 4px; display: block; text-align: right; }
</style>
</head>
<body>

<div id="notification"></div>

<div class="hero-content">
  <h1>AssetGuard Pro</h1>
  <nav class="top-nav">
    <div class="logo">OPERATOR PORTAL</div>
    <button class="menu-btn" onclick="toggleAuth()">LOGIN</button>
  </nav>
</div>

<div class="auth-overlay" id="authOverlay" onclick="closeIfOutside(event)">
  <div class="scene" onclick="event.stopPropagation()">
    <div class="card" id="card">
      
      <!-- Sign In Face -->
      <div class="face login">
        <h2>Sign In</h2>
        <div class="role-label-title">Select User Type:</div>
        <div class="role-picker">
          <label class="role-option"><input type="radio" name="l_role" value="fixed_area" checked onchange="toggleRoleFields('l')"> Fixed Area User</label>
          <label class="role-option"><input type="radio" name="l_role" value="marketing_team" onchange="toggleRoleFields('l')"> Marketing Team</label>
        </div>

        <!-- Marketing Team Extra Inputs -->
        <div id="l_marketingBox" class="marketing-extra-box">
          <span class="auto-date-badge" id="l_dateDisplay">Date: --</span>
          <input id="l_carReg" type="text" placeholder="Car Registration Number">
          <select id="l_teamRole">
            <option value="" disabled selected>Select Team Role</option>
            <option value="Driver">Driver</option>
            <option value="Sales Representative">Sales Representative</option>
            <option value="Team Leader">Team Leader</option>
            <option value="Field Officer">Field Officer</option>
          </select>
        </div>

        <input id="l_email" type="email" placeholder="Email Address">
        <input id="l_pin" type="password" placeholder="Password / PIN">
        <button class="action-btn" id="loginBtn" onclick="doLogin()">Authenticate</button>
        <div class="link" onclick="showForgotModal()">Forgot Access?</div>
        <div class="link" style="color:#64748b" onclick="goRegister()">Create New Account</div>
      </div>

      <!-- Register Face -->
      <div class="face register">
        <h2>New Account</h2>
        <div class="role-label-title">Select User Type:</div>
        <div class="role-picker">
          <label class="role-option"><input type="radio" name="r_role" value="fixed_area" checked onchange="toggleRoleFields('r')"> Fixed Area User</label>
          <label class="role-option"><input type="radio" name="r_role" value="marketing_team" onchange="toggleRoleFields('r')"> Marketing Team</label>
        </div>

        <!-- Marketing Team Extra Inputs -->
        <div id="r_marketingBox" class="marketing-extra-box">
          <span class="auto-date-badge" id="r_dateDisplay">Date: --</span>
          <input id="r_carReg" type="text" placeholder="Car Registration Number">
          <select id="r_teamRole">
            <option value="" disabled selected>Select Team Role</option>
            <option value="Driver">Driver</option>
            <option value="Sales Representative">Sales Representative</option>
            <option value="Team Leader">Team Leader</option>
            <option value="Field Officer">Field Officer</option>
          </select>
        </div>

        <input id="r_user" placeholder="Full Name">
        <input id="r_email" type="email" placeholder="Email Address">
        <input id="r_phone" type="tel" placeholder="Phone Number (e.g. 07XXXXXXXX)">
        <input id="r_pass" type="password" placeholder="Password">
        <input id="r_pass_confirm" type="password" placeholder="Confirm Password">
        <button class="action-btn" id="regBtn" onclick="doSignup()">Create Account</button>
        <div class="link" onclick="goLogin()">Return to Login</div>
      </div>

    </div>
  </div>
</div>

<div class="modal" id="forgotModal">
  <div class="modal-content">
    <h2 style="margin-top:0;">Reset PIN</h2>
    <input id="f_email" type="email" placeholder="Registered Email">
    <button class="action-btn" onclick="doReset()">Send Reset Link</button>
    <div class="link" style="color:red; margin-top:15px;" onclick="closeForgotModal()">Cancel</div>
  </div>
</div>

<script>
const DASHBOARD_URL = "dashboard.html"; 

const firebaseConfig = {
  apiKey: "AIzaSyDCkP7LTzdNcvZhp24rRsQirYDCcrsuvOA",
  authDomain: "assetguard-c8c8c.firebaseapp.com",
  projectId: "assetguard-c8c8c",
  databaseURL: "https://assetguard-c8c8c-default-rtdb.firebaseio.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const rtdb = firebase.database();

document.addEventListener("DOMContentLoaded", () => {
  const todayStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  document.getElementById("l_dateDisplay").innerText = "Date: " + todayStr;
  document.getElementById("r_dateDisplay").innerText = "Date: " + todayStr;
});

function toggleRoleFields(prefix) {
  const selectedRole = document.querySelector(`input[name="${prefix}_role"]:checked`).value;
  const box = document.getElementById(`${prefix}_marketingBox`);
  box.style.display = (selectedRole === "marketing_team") ? "block" : "none";
}

function msg(text, color="#ef4444") {
  const el = document.getElementById("notification");
  el.innerText = text; el.style.backgroundColor = color; el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3500);
}

function toggleAuth() {
  const o = document.getElementById("authOverlay");
  o.style.display = (o.style.display === "flex") ? "none" : "flex";
}
function closeIfOutside(e) { if (e.target.id === "authOverlay") toggleAuth(); }
function goRegister() { document.getElementById("card").className = "card flip-register"; }
function goLogin() { document.getElementById("card").className = "card"; }
function showForgotModal() { document.getElementById("forgotModal").style.display = "flex"; }
function closeForgotModal() { document.getElementById("forgotModal").style.display = "none"; }

async function doLogin() {
  const email = document.getElementById("l_email").value.trim().toLowerCase();
  const pass = document.getElementById("l_pin").value.trim();
  const roleInput = document.querySelector('input[name="l_role"]:checked');
  const role = roleInput ? roleInput.value : "fixed_area";
  
  let carReg = "";
  let teamRole = "";
  const currentDate = new Date().toISOString().split('T')[0];

  if (role === "marketing_team") {
    carReg = document.getElementById("l_carReg").value.trim();
    teamRole = document.getElementById("l_teamRole").value;
    if (!carReg || !teamRole) {
      return msg("Please enter Car Registration Number and select a Team Role.");
    }
  }

  const btn = document.getElementById("loginBtn");
  if (!email || !pass) return msg("Please enter all details");
  btn.disabled = true; btn.innerText = "Authenticating...";

  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const userCredential = await auth.signInWithEmailAndPassword(email, pass);
    const user = userCredential.user;
    
    localStorage.setItem("ag_active_uid", user.uid);
    localStorage.setItem("ag_session_active", "true");
    localStorage.setItem("ag_user_role", role);
    if (role === "marketing_team") {
      localStorage.setItem("ag_car_reg", carReg);
      localStorage.setItem("ag_team_role", teamRole);
      localStorage.setItem("ag_session_date", currentDate);
    }

    const updatePayload = {
      email: email,
      role: role,
      lastLogin: Date.now()
    };

    if (role === "marketing_team") {
      updatePayload.carRegistration = carReg;
      updatePayload.teamRole = teamRole;
      updatePayload.sessionDate = currentDate;
      // Initialize dispatch status as pending if not already approved/present
      updatePayload.dispatchApproved = false;
      updatePayload.dispatchStatus = "pending";

      // Also create a standalone dispatch request node for admin panel tracking
      await rtdb.ref(`dispatch_requests/${user.uid}`).update({
        uid: user.uid,
        email: email,
        carRegistration: carReg,
        teamRole: teamRole,
        sessionDate: currentDate,
        dispatchApproved: false,
        status: "pending",
        requestedAt: Date.now()
      });
    }

    await rtdb.ref(`users/${user.uid}`).update(updatePayload);
    await rtdb.ref(`user_statuses/${user.uid}`).set("Active");

    await rtdb.ref(`user_activity_logs`).push({
      uid: user.uid,
      category: "SECURITY",
      action: "User Online Login",
      description: `User logged in as [${role}]. Car: ${carReg || 'N/A'}, Role: ${teamRole || 'N/A'}`,
      timestamp: Date.now(),
      device: navigator.userAgent
    });

    window.location.href = DASHBOARD_URL;

  } catch (err) {
    console.error("Login Error:", err);
    msg("Login failed: " + err.message);
    btn.disabled = false; btn.innerText = "Authenticate";
  }
}

async function doSignup() {
  const name = document.getElementById("r_user").value.trim();
  const email = document.getElementById("r_email").value.trim().toLowerCase();
  const phone = document.getElementById("r_phone").value.trim();
  const pass = document.getElementById("r_pass").value;
  const confirm = document.getElementById("r_pass_confirm").value;
  const roleInput = document.querySelector('input[name="r_role"]:checked');
  const role = roleInput ? roleInput.value : "fixed_area";

  let carReg = "";
  let teamRole = "";
  const currentDate = new Date().toISOString().split('T')[0];

  if (role === "marketing_team") {
    carReg = document.getElementById("r_carReg").value.trim();
    teamRole = document.getElementById("r_teamRole").value;
    if (!carReg || !teamRole) {
      return msg("Please enter Car Registration Number and select a Team Role.");
    }
  }

  if (!navigator.onLine) return msg("Internet required for setup");
  if (!email || !pass || !name) return msg("Please fill in all required fields");
  if (pass !== confirm) return msg("Passwords do not match");

  try {
    const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
    const user = userCredential.user;

    const userPayload = {
      uid: user.uid,
      fullName: name,
      email: email,
      phone: phone || "Not provided",
      role: role,
      joinedAt: Date.now(),
      lastLogin: Date.now()
    };

    if (role === "marketing_team") {
      userPayload.carRegistration = carReg;
      userPayload.teamRole = teamRole;
      userPayload.registrationDate = currentDate;
      userPayload.dispatchApproved = false;
      userPayload.dispatchStatus = "pending";
    }

    await rtdb.ref(`users/${user.uid}`).set(userPayload);
    await rtdb.ref(`user_statuses/${user.uid}`).set("Active");
    
    msg("Account Created Successfully!", "#10b981");
    setTimeout(() => { goLogin(); }, 1200);
  } catch (err) { 
    console.error("Signup Error:", err);
    alert("Database / Signup Error: " + err.message); 
  }
}

async function doReset() {
  const email = document.getElementById("f_email").value.trim();
  if (!email) return msg("Enter email first");
  try {
    await auth.sendPasswordResetEmail(email);
    msg("Reset link sent!", "#10b981");
    closeForgotModal();
  } catch (e) { msg(e.message); }
}
</script>
</body>
</html>
